name: Auto Checkin with Retry Logic

on:
  schedule:
    # 每天 UTC 时间 0:10 运行（北京时间 8:10）
    - cron: '10 0 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  checkin:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        pip install requests
    
    - name: Run checkin script
      id: checkin
      env:
        # 网站登录信息
        EMAIL: ${{ secrets.EMAIL }}
        PASSWORD: ${{ secrets.PASSWORD }}
        
        # 邮件配置
        MAIL_FROM: ${{ secrets.MAIL_FROM }}
        MAIL_TO: ${{ secrets.MAIL_TO }}
        
        # Azure OAuth2配置
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        
        # 重试配置
        MAX_RETRY_ATTEMPTS: 3
        RETRY_DELAY_HOURS: 4
      run: |
        # 创建检查点文件
        mkdir -p checkpoint
        CHECKPOINT_FILE="checkpoint/checkin_status.json"
        
        # 检查是否是第一次运行今天的任务
        TODAY=$(date -u +"%Y-%m-%d")
        if [ -f "$CHECKPOINT_FILE" ]; then
          CHECKPOINT_DATE=$(jq -r '.check_date' "$CHECKPOINT_FILE" 2>/dev/null || echo "")
          
          if [ "$CHECKPOINT_DATE" != "$TODAY" ]; then
            echo "新的一天，重置检查点..."
            echo '{"check_date": "'$TODAY'", "retry_count": 0, "success": false}' > "$CHECKPOINT_FILE"
          fi
        else
          echo "初始化检查点..."
          echo '{"check_date": "'$TODAY'", "retry_count": 0, "success": false}' > "$CHECKPOINT_FILE"
        fi
        
        # 读取当前重试次数
        RETRY_COUNT=$(jq -r '.retry_count' "$CHECKPOINT_FILE" 2>/dev/null || echo "0")
        SUCCESS_STATUS=$(jq -r '.success' "$CHECKPOINT_FILE" 2>/dev/null || echo "false")
        
        # 如果今天已经成功，则跳过
        if [ "$SUCCESS_STATUS" = "true" ]; then
          echo "今天已成功签到，跳过执行"
          echo "result=already_success" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        # 检查是否超过最大重试次数
        if [ "$RETRY_COUNT" -ge 3 ]; then
          echo "已达到最大重试次数(3)，今日不再重试"
          echo "result=max_retries" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        echo "当前重试次数: $RETRY_COUNT/3"
        
        # 运行签到脚本
        python checkin.py
        CHECKIN_EXIT_CODE=$?
        
        # 检查退出状态
        if [ $CHECKIN_EXIT_CODE -eq 0 ]; then
          echo "签到成功"
          echo '{"check_date": "'$TODAY'", "retry_count": 0, "success": true}' > "$CHECKPOINT_FILE"
          echo "result=success" >> $GITHUB_OUTPUT
        else
          echo "签到失败"
          
          # 增加重试次数
          NEW_RETRY_COUNT=$((RETRY_COUNT + 1))
          echo '{"check_date": "'$TODAY'", "retry_count": '$NEW_RETRY_COUNT', "success": false}' > "$CHECKPOINT_FILE"
          
          if [ "$NEW_RETRY_COUNT" -lt 3 ]; then
            echo "将在4小时后重试（第$NEW_RETRY_COUNT次重试）"
            echo "result=retry" >> $GITHUB_OUTPUT
          else
            echo "已达到最大重试次数(3)，今日不再重试"
            echo "result=failed" >> $GITHUB_OUTPUT
          fi
          
          exit 1
        fi
    
    - name: Save checkpoint
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: checkin-checkpoint-${{ github.run_id }}
        path: checkpoint/
        retention-days: 2
    
    - name: Send failure notification
      if: steps.checkin.outputs.result == 'failed'
      run: |
        echo "签到失败，已达到最大重试次数"
        # 这里可以添加发送通知的代码
